# fly.toml app configuration file generated for study-3kfyqq on 2026-07-28T08:43:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'study-3kfyqq'
primary_region = 'fra'

[build]

[env]
  ASPNETCORE_URLS = 'http://+:8080'
  StudyApp__DataDirectory = '/data'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
